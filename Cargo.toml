[workspace]
resolver = "3"
members = ["crates/wowzers-core", "crates/wowzers"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/jtyuill/wowzers"

[workspace.dependencies]
wowzers-core = { path = "crates/wowzers-core" }
dirs = "7"
gpui-kit = "=0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["json"] }
zip = { version = "5", default-features = false, features = ["deflate"] }
